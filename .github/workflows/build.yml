name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: xcodebuild (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          swift --version

      # The Release configuration requires Sims/Local.xcconfig with a
      # real DEVELOPMENT_TEAM. CI runs the Debug configuration with
      # signing disabled — that exercises the compile + link path
      # without needing any developer credentials.
      - name: Build (Debug, no signing)
        run: |
          xcodebuild \
            -project Sims.xcodeproj \
            -scheme Sims \
            -configuration Debug \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/ci \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
